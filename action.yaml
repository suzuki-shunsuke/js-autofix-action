name: Fix JavaScript Action projects
description: Fix JavaScript Action projects and push the fix with autofix.ci
author: Shunsuke Suzuki
inputs:
  aqua_version:
    description: The version of aqua
    required: true
  prettier_directory:
    description: |
      The directory where package.json and package-lock.json of prettier exist.
      node_modules restored from the artifact is extracted here.
    required: false
    default: .github/prettier
  npm_artifact_name:
    description: The name of the artifact of node_modules created by suzuki-shunsuke/download-npm-package-action
    required: false
    default: node_modules-autofix
  node-version-file:
    description: Node.js version file path
    required: false
    default: .node-version
  checkout:
    description: |
      Whether this action checks out the head commit of the pull request.
      Set false to change files before this action, e.g. to generate code.
      Then the caller must check out github.event.pull_request.head.sha.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: inputs.checkout == 'true'
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false

    - run: echo "AQUA_GLOBAL_CONFIG=${AQUA_GLOBAL_CONFIG:-}:${GITHUB_ACTION_PATH}/aqua/aqua.yaml" >> "$GITHUB_ENV"
      shell: bash
    - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
      with:
        aqua_version: ${{inputs.aqua_version}}
        # Create only links here and install nllint after updating aqua-checksums.json.
        # Installing packages before that fails with "checksum is required"
        # when a pull request updates a package in the repository's aqua.yaml,
        # because aqua-checksums.json doesn't have the new version's checksums yet.
        # -a is required to create links of packages in AQUA_GLOBAL_CONFIG
        aqua_opts: -l -a

    # aqua-checksums.json
    - name: Update aqua-checksums.json
      shell: bash
      env:
        AQUA_GITHUB_TOKEN: ${{github.token}}
      run: |
        # Use pathspecs instead of grep, which fails with pipefail if no file matches
        git ls-files -- 'aqua-checksums.json' '**/aqua-checksums.json' | while read -r file; do
          echo "[INFO] aqua upc -prune in $(dirname "$file")" >&2
          (cd "$(dirname "$file")" && aqua upc -prune)
        done

    - name: Install nllint
      uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
      with:
        aqua_version: ${{inputs.aqua_version}}
        skip_install_aqua: "true"
        # -a is required to install packages in AQUA_GLOBAL_CONFIG
        aqua_opts: -a
        packages: nllint

    # prettier
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{inputs.node-version-file}}
    # Use only prettier restored from the artifact.
    # Don't run npm ci here because this job doesn't have id-token: write for Takumi Guard.
    - name: Restore prettier
      uses: suzuki-shunsuke/download-npm-package-action/restore@cd93d0e45a1804793f6daaf4c24bf55ccf12f494 # v0.0.4
      with:
        working_directory: ${{inputs.prettier_directory}}
        artifact_name: ${{inputs.npm_artifact_name}}
    - name: Format with prettier
      shell: bash
      env:
        PRETTIER_DIRECTORY: ${{inputs.prettier_directory}}
      run: '"$PRETTIER_DIRECTORY/node_modules/.bin/prettier" --write .'

    # Newlines
    - run: git ls-files | xargs nllint -f -s
      shell: bash

    - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
