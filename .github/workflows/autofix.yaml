---
name: autofix.ci
on: pull_request
permissions: {}
jobs:
  # Don't add jobs to this file. Please add jobs to the reusable workflow.
  fix:
    uses: ./.github/workflows/autofix-ci.yaml
    permissions:
      contents: read
      id-token: write
    with:
      aqua_version: v2.64.0
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
  autofix:
    # Required status check of this workflow
    runs-on: ubuntu-26.04
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    timeout-minutes: 10
    permissions: {}
    needs:
      - fix
    steps:
      - run: exit 1
  # Don't add jobs to this file. Please add jobs to the reusable workflow.
